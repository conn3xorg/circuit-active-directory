name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

env:
  # The first Conn3x commit with windows_ad_ou, windows_ad_group and
  # windows_ad_user. No release has them yet, so CI builds Conn3x from it.
  CONN3X_REF: d39bab3978ea3f16751d2eed79d7f15f5f34288a

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: conn3xorg/conn3x
          ref: ${{ env.CONN3X_REF }}
          path: conn3x
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: conn3x/go.mod
          cache: false
      - name: Build Conn3x
        run: |
          go -C conn3x build -o "$RUNNER_TEMP/bin/conn3x" ./cmd/conn3x
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          # Its test data has HCL that's broken on purpose, and fmt below would read it.
          rm -rf conn3x
      - run: conn3x version
      - run: conn3x fmt -check -recursive
      - name: Validate
        run: conn3x init -backend=false && conn3x validate
      - name: Validate the test config
        working-directory: test
        run: conn3x init -backend=false && conn3x validate

  # Windows can't run in a container, so this plans the circuit against the
  # runner itself, over loopback OpenSSH, the way Conn3x's own windows-host
  # job does. A shared runner can't reboot or become a domain controller, so
  # it reads every step for real, installs AD DS, and stops before the forest.
  windows:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    name: windows (${{ matrix.os }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: conn3xorg/conn3x
          ref: ${{ env.CONN3X_REF }}
          path: conn3x
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: conn3x/go.mod
          cache: false
      - name: Build Conn3x
        shell: pwsh
        run: |
          go -C conn3x build -o "$env:RUNNER_TEMP\bin\conn3x.exe" ./cmd/conn3x
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Add-Content $env:GITHUB_PATH "$env:RUNNER_TEMP\bin"
      - name: Start sshd with a throwaway login key
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Service sshd -ErrorAction SilentlyContinue)) {
            Add-WindowsCapability -Online -Name 'OpenSSH.Server~~~~0.0.1.0' | Out-Null
          }
          $d = 'C:\ProgramData\ssh'
          New-Item -ItemType Directory -Force $d | Out-Null
          $work = "$env:RUNNER_TEMP\win"
          New-Item -ItemType Directory -Force $work | Out-Null
          & "$env:WINDIR\System32\OpenSSH\ssh-keygen.exe" -q -t ed25519 -N '' -f "$work\admin"
          if ($LASTEXITCODE) { throw 'login key' }
          Remove-Item "$d\ssh_host_*" -Force -ErrorAction SilentlyContinue
          Copy-Item "$work\admin.pub" "$d\administrators_authorized_keys"
          & icacls.exe "$d\administrators_authorized_keys" /inheritance:r /grant '*S-1-5-18:F' /grant '*S-1-5-32-544:F' | Out-Null
          if ($LASTEXITCODE) { throw 'icacls' }
          Set-Service sshd -StartupType Manual
          # With no host keys left, sshd makes its own as it starts.
          Restart-Service sshd
          $hk = (Get-Content "$d\ssh_host_ed25519_key.pub" -Raw).Trim()
          $key = "$work\admin" -replace '\\', '/'
          Set-Content test\ci.auto.tfvars "user     = `"$env:USERNAME`"`nkey_file = `"$key`"`nhost_key = `"$hk`""
      - name: Plan the domain, install AD DS, plan again
        shell: pwsh
        working-directory: test
        run: |
          $ErrorActionPreference = 'Stop'
          conn3x init
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # Every read on a host that isn't a DC yet: the plan has the whole
          # forest root in it, and reading changes nothing.
          $plan = conn3x plan -no-color -detailed-exitcode | Out-String
          if ($LASTEXITCODE -ne 2) { Write-Output $plan; throw "first plan exit $LASTEXITCODE, want 2" }
          foreach ($want in 'forest__ad_ds', 'forest__forest', 'forest__promoted', 'forest__adws', 'forest__dns', 'forest__ous["runner/Lab"]', 'forest__child_ous["runner/Servers"]', 'forest__users["runner/alice"]', 'forest__groups["runner/LabAdmins"]') {
            if (-not $plan.Contains($want)) { Write-Output $plan; throw "plan has no $want" }
          }
          conn3x apply -no-color -auto-approve -target module.ad.conn3x_windows_feature.forest__ad_ds
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (-not (Get-WindowsFeature AD-Domain-Services).Installed) { throw 'AD DS is not installed' }
          # AD DS is there now, so only the steps after it are left.
          $plan = conn3x plan -no-color -detailed-exitcode | Out-String
          if ($LASTEXITCODE -ne 2) { Write-Output $plan; throw "second plan exit $LASTEXITCODE, want 2" }
          if ($plan.Contains('forest__ad_ds["runner"] will be')) { Write-Output $plan; throw 'AD DS planned again' }
          if (-not $plan.Contains('forest__forest')) { Write-Output $plan; throw 'plan has no forest' }
          Write-Output $plan
          # plan's 2 is what this step wants; don't let it become the step's exit code.
          exit 0
